name: Validate Simplifica Agenda
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --check server/src/app.js
      - run: npm test
      - run: npm run build
